name: Update games

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:         # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-games
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Stockfish and python-chess
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish
          pip install chess==1.11.2

      - name: Download new games and review them
        env:
          CHESS_USER: chaflox
          DEPTH: "14"
          MAX_MINUTES: "40"
        run: python scripts/update.py

      - name: Save results
        run: |
          git config user.name "chess-review bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Update games and reviews"
            git pull --rebase
            git push
          fi
