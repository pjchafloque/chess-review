name: Lichess sample (scratch)

on:
  push:
    branches: [repertoire-sample]

permissions:
  contents: write
  actions: read

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lichess-sample
          run-id: 44405674730
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: sample
      - name: Commit the sample to this branch
        run: |
          ls -la sample
          mkdir -p data && cp sample/lichess-sample.json data/lichess-sample.json
          git config user.name "chess-review bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lichess-sample.json
          git commit -m "Lichess sample (rated rapid, both players 1300-1800)"
          git push
